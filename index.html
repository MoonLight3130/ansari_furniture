<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/brand/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ansari Furniture | Where Comfort Meets Timeless Design</title>
    <meta name="description" content="Thoughtfully crafted furniture for modern homes. Blending natural materials, elegant design, and lasting quality — because every space tells a story." />
    <meta name="theme-color" content="#F5F0E8" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ansari Furniture | Where Comfort Meets Timeless Design" />
    <meta property="og:description" content="Thoughtfully crafted furniture for modern homes. Blending natural materials, elegant design, and lasting quality." />
    <meta property="og:image" content="/images/showroom/hero_showroom.jpg" />
    <meta property="og:site_name" content="Ansari Furniture" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ansari Furniture | Where Comfort Meets Timeless Design" />
    <meta name="twitter:description" content="Thoughtfully crafted furniture for modern homes. Blending natural materials, elegant design, and lasting quality." />
    <meta name="twitter:image" content="/images/showroom/hero_showroom.jpg" />

    <!-- Performance: Preconnect & DNS-Prefetch for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Preload Largest Contentful Paint (LCP) Hero Image -->
    <link rel="preload" as="image" href="/images/showroom/hero_showroom.jpg" fetchpriority="high" />

    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
